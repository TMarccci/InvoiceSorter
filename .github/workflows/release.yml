# Release: builds both installers (InvoiceSorter-Setup-x.y.z.exe and InvoiceSorter-Server-Setup-x.y.z.exe) with the
# version of the git tag and publishes them as a GitHub release. The clients check this release for new versions.
#
#   * Push a tag yourself:   git tag v1.4.0 && git push origin v1.4.0   (1.4.0 without the "v" works too)
#   * Or let the workflow pick the next version: Actions → Release → Run workflow → patch / minor / major
#     (it creates and pushes the tag v<next> from the latest v* tag, then builds the release).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write           # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' '[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
            latest=${latest:-0.0.0}
            IFS=. read -r major minor patch <<< "$latest"
            case "${{ inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            tag="v$major.$minor.$patch"
            echo "Latest tag $latest → $tag"
          fi
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$tag' is not a version tag like v1.2.3 or 1.2.3"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Create the tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InvoiceSorter.slnx

      - name: Test
        run: dotnet test tests/InvoiceSorter.Tests -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installers
        shell: pwsh
        run: |
          ./scripts/build-client.ps1 -Version ${{ steps.version.outputs.version }}
          ./scripts/build-server.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Checksums
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $files = "installer/client/Output/InvoiceSorter-Setup-$v.exe", "installer/server/Output/InvoiceSorter-Server-Setup-$v.exe"
          Get-FileHash $files -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          # "Latest" only for the highest version: a fix of an older version must not hide a newer release.
          highest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' '[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
          latest=true; [[ "$highest" != "$v" ]] && latest=false
          echo "Highest version tag: $highest → latest=$latest"
          gh release create "${{ steps.version.outputs.tag }}" --latest=$latest \
            "installer/client/Output/InvoiceSorter-Setup-$v.exe" \
            "installer/server/Output/InvoiceSorter-Server-Setup-$v.exe" \
            SHA256SUMS.txt \
            --title "Invoice Sorter $v" --generate-notes
